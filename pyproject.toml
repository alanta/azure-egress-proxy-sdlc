[project]
name = "azure-egress-proxy-sdlc"
version = "0.1.0"
description = "Keeps alanta/azure-egress-proxy up to date: dependency scans, validated updates and release advice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "json5>=0.12",
    "jsonschema>=4.23",
    "packaging>=24",
    "pyyaml>=6",
]

[project.scripts]
sdlc = "sdlc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and drive git directly to build throwaway repositories.
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
